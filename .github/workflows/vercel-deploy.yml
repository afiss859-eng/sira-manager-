name: Vercel Admin Deploy

on:
  workflow_dispatch:

# This workflow is intentionally manual until the Vercel secrets are configured.
# A missing deployment credential must not create a false-red CI result on every code push.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: vercel-admin-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy SIRA Manager Admin to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Vercel configuration
        id: config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Vercel deployment secrets are configured.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Vercel deployment secrets are not configured; deployment skipped safely.'
          fi

      - name: Install Vercel CLI
        if: steps.config.outputs.ready == 'true'
        run: npm install --global vercel@latest

      - name: Deploy production
        if: steps.config.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"

      - name: Configuration status
        if: steps.config.outputs.ready != 'true'
        run: echo 'Manual setup required: configure VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID in GitHub Actions secrets.'
