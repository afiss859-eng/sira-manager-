name: SIRA OTA Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  business:
    name: Build SIRA Business release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Assemble signed release
        env:
          KEYSTORE_B64: ${{ secrets.SIRA_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SIRA_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIRA_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'SIRA_KEYSTORE_B64 secret missing'; exit 1; }
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          VERSION_CODE=$(awk -F. '{printf "%d\n", ($1*10000)+($2*100)+$3}' <<< "$VERSION_NAME")
          printf '%s' "$KEYSTORE_B64" | base64 -d > my-upload-key.jks
          gradle assembleRelease --no-daemon --stacktrace -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "sira-business-${VERSION_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: sira-business-release-file
          path: sira-business-*.apk
          if-no-files-found: error

  orange-money:
    name: Build SIRA Orange Money release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Assemble signed release
        working-directory: orange-money
        env:
          KEYSTORE_B64: ${{ secrets.SIRA_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SIRA_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIRA_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'SIRA_KEYSTORE_B64 secret missing'; exit 1; }
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          VERSION_CODE=$(awk -F. '{printf "%d\n", ($1*10000)+($2*100)+$3}' <<< "$VERSION_NAME")
          printf '%s' "$KEYSTORE_B64" | base64 -d > my-upload-key.jks
          gradle assembleRelease --no-daemon --stacktrace -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "../sira-orange-money-${VERSION_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: sira-orange-money-release-file
          path: sira-orange-money-*.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub Release for OTA
    needs: [business, orange-money]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*release-file'
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" sira-business-*.apk sira-orange-money-*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "SIRA Manager $GITHUB_REF_NAME" \
            --notes "Mise à jour OTA obligatoire pour SIRA Business et SIRA Orange Money.\n\nChaque version plus récente est forcée par le service OTA."
