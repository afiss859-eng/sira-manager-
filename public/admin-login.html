<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SIRA Manager — Connexion</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 10% 0,#dfeeff,transparent 32%),linear-gradient(145deg,#f7f9fc,#eef3f8);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033}.box{width:min(430px,calc(100% - 28px));background:rgba(255,255,255,.92);border:1px solid #e4e9f1;border-radius:28px;padding:28px;box-shadow:0 28px 80px rgba(15,23,42,.12);backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.brand img{width:54px;height:54px;border-radius:16px;object-fit:cover}.brand b{display:block;font-size:18px}.brand span{display:block;color:#718096;font-size:11px;margin-top:3px}h1{font-size:29px;letter-spacing:-.05em;margin:0 0 8px}p{font-size:12px;line-height:1.6;color:#6b7280;margin:0 0 22px}.field{display:grid;gap:7px}.field label{font-size:11px;font-weight:800;color:#475569}.field input{width:100%;padding:13px 14px;border:1px solid #d7dee8;border-radius:14px;background:#fbfcfe;outline:none;font-size:13px}.field input:focus{border-color:#005ac1;box-shadow:0 0 0 4px rgba(0,90,193,.1)}button{width:100%;margin-top:12px;border:0;border-radius:14px;padding:13px 14px;background:#005ac1;color:#fff;font-weight:800;cursor:pointer}.status{min-height:20px;margin-top:12px;font-size:11px;color:#991b1b}.foot{margin-top:20px;padding-top:15px;border-top:1px solid #edf0f4;color:#8a94a6;font-size:10px;line-height:1.5}</style></head><body><main class="box"><div class="brand"><img src="sira_logo.jpg" alt="SIRA"><div><b>SIRA Manager</b><span>Administration centrale</span></div></div><h1>Connexion administrateur</h1><p>Accès réservé au contrôle des licences et à la gestion opérationnelle SIRA Manager.</p><form id="login"><div class="field"><label for="secret">Secret administrateur</label><input id="secret" type="password" autocomplete="current-password" required minlength="32" placeholder="Votre secret SIRA_ADMIN_SECRET"></div><button type="submit">Ouvrir le centre de contrôle</button></form><div class="status" id="status"></div><div class="foot">La session est signée côté serveur, stockée dans un cookie HttpOnly et expire automatiquement après 8 heures.</div></main><script>
const form=document.getElementById('login'),status=document.getElementById('status');
fetch('/api/admin/session',{credentials:'same-origin'}).then(r=>r.json()).then(x=>{if(x.authenticated) location.replace('/admin.html')}).catch(()=>{});
form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='Connexion…';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({secret:document.getElementById('secret').value})});const x=await r.json();if(!r.ok||!x.ok)throw new Error(x.error||'Connexion refusée.');location.replace('/admin.html')}catch(err){status.textContent=err.message}});
</script></body></html>
