name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-license:
    name: API - license and admin tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: License unit tests
        env:
          SIRA_LICENSE_SECRET: ${{ secrets.SIRA_LICENSE_SECRET_TEST }}
        run: node --test api/licenses/_lib.test.js
      - name: Admin session unit tests
        env:
          SIRA_ADMIN_SECRET: test-admin-secret-012345678901234567890123456789
        run: node --test api/admin/_auth.test.js

  business:
    name: SIRA Business - test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload SIRA Business APK
        uses: actions/upload-artifact@v4
        with:
          name: sira-business-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  orange-money:
    name: SIRA Orange Money - test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: orange-money
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload SIRA Orange Money APK
        uses: actions/upload-artifact@v4
        with:
          name: sira-orange-money-debug-apk
          path: orange-money/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
