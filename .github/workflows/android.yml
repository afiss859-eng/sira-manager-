name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# GitHub is moving Actions runtime execution from Node 20 to Node 24.
# Opt in early so the CI does not accumulate runtime deprecation warnings.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  business:
    name: SIRA Business - test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload SIRA Business APK
        uses: actions/upload-artifact@v4
        with:
          name: sira-business-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  orange-money:
    name: SIRA Orange Money - test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: orange-money
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload SIRA Orange Money APK
        uses: actions/upload-artifact@v4
        with:
          name: sira-orange-money-debug-apk
          path: orange-money/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
